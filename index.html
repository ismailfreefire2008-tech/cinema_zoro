<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما زورو - مشاهدة أفلام مباشرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .header p {
            color: rgba(255,255,255,0.7);
            margin-top: 10px;
        }
        
        .search-section {
            margin-bottom: 30px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .search-box input {
            width: 50%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }
        
        .search-box input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .search-box button {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .search-box button:hover {
            transform: scale(1.05);
        }
        
        .categories {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .cat-btn {
            padding: 8px 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cat-btn:hover, .cat-btn.active {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            display: none;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .movies-slider {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scroll-behavior: smooth;
            padding: 10px 0;
            border-radius: 15px;
        }
        
        .movies-slider::-webkit-scrollbar {
            height: 8px;
        }
        
        .movies-slider::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        
        .movies-slider::-webkit-scrollbar-thumb {
            background: #4ecdc4;
            border-radius: 10px;
        }
        
        .movies-row {
            display: inline-flex;
            gap: 20px;
            padding: 10px;
        }
        
        .movie-card {
            width: 200px;
            display: inline-block;
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            white-space: normal;
        }
        
        .movie-card:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .movie-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        
        .movie-info {
            padding: 12px;
        }
        
        .movie-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #4ecdc4;
        }
        
        .movie-title-en {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
        }
        
        .movie-year {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
        }
        
        .movie-page {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .movie-page.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            background: #4ecdc4;
        }
        
        .movie-hero {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .poster-container {
            width: 300px;
            min-width: 300px;
        }
        
        .poster-container img {
            width: 100%;
            border-radius: 15px;
        }
        
        .movie-hero-details {
            flex: 1;
        }
        
        .movie-hero-title {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #4ecdc4;
        }
        
        .movie-hero-title-en {
            font-size: 1rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 15px;
        }
        
        .movie-hero-info {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-badge {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .movie-overview {
            line-height: 1.7;
            margin-bottom: 25px;
        }
        
        .watch-btn {
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        
        .watch-btn:hover {
            transform: scale(1.05);
        }
        
        .cast-section {
            margin-top: 30px;
        }
        
        .cast-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .cast-list {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .cast-item {
            text-align: center;
            min-width: 100px;
        }
        
        .cast-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .cast-name {
            font-size: 0.8rem;
            margin-top: 8px;
        }
        
        .cast-character {
            font-size: 0.65rem;
            color: #ff6b6b;
        }
        
        .watch-frame {
            display: none;
            margin-top: 30px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 20px;
        }
        
        .watch-frame.active {
            display: block;
        }
        
        .servers-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .server-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .server-btn:hover, .server-btn.active {
            background: #4ecdc4;
            color: #1a1a2e;
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 15px;
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .fullscreen-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 10;
        }
        
        .close-watch {
            background: #ff6b6b;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 15px;
            float: left;
        }
        
        @media (max-width: 768px) {
            .search-box input { width: 70%; }
            .movie-card { width: 150px; }
            .movie-poster { height: 220px; }
            .poster-container { width: 100%; min-width: auto; }
            .movie-hero { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 سينما زورو</h1>
            <p>مشاهدة أفلام ومسلسلات مباشرة - بدون إعلانات</p>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 ابحث عن فيلم أو مسلسل..." value="dhoom">
                <button onclick="searchMovies()">🔍 بحث</button>
            </div>
            <div class="categories">
                <button class="cat-btn active" onclick="loadMoviesByCategory('popular', this)">⭐ الأكثر مشاهدة</button>
                <button class="cat-btn" onclick="loadMoviesByCategory('top_rated', this)">🏆 الأعلى تقييماً</button>
                <button class="cat-btn" onclick="loadRandomMovies(this)">🎲 أفلام عشوائية</button>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>جاري تحميل الأفلام...</p>
        </div>
        
        <div class="movies-slider" id="moviesSlider">
            <div class="movies-row" id="moviesRow"></div>
        </div>
        
        <div class="movie-page" id="moviePage">
            <button class="back-btn" onclick="backToMovies()">← العودة إلى القائمة</button>
            <div class="movie-hero" id="movieHero"></div>
            <div class="watch-frame" id="watchFrame">
                <button class="close-watch" onclick="closeWatch()">✖ إغلاق المشغل</button>
                <div class="servers-list" id="serversList"></div>
                <div class="video-wrapper" id="videoWrapper">
                    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== TMDB API Configuration ==========
        const TMDB_API_KEY = "3a8ae487e78dd063fab0717d28aba865";
        const TMDB_BASE = "https://api.themoviedb.org/3";
        const IMG_BASE = "https://image.tmdb.org/t/p/w500";
        
        // ========== رابط السيرفر العمومي ==========
        const API_URL = "https://began-modes-sociology-pct.trycloudflare.com/api/links?title=";
        
        let currentVideos = [];
        
        async function fetchFromTMDB(endpoint, params = {}) {
            const url = new URL(`${TMDB_BASE}${endpoint}`);
            url.searchParams.append("api_key", TMDB_API_KEY);
            url.searchParams.append("language", "ar");
            Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
            const response = await fetch(url);
            return response.json();
        }
        
        async function loadMoviesByCategory(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            document.getElementById('loading').style.display = 'block';
            document.getElementById('moviesRow').innerHTML = '';
            document.getElementById('moviePage').classList.remove('active');
            
            try {
                const data = await fetchFromTMDB(`/movie/${category}`);
                displayMovies(data.results || []);
            } catch (error) {
                document.getElementById('moviesRow').innerHTML = `<div style="color:red;">❌ خطأ: ${error.message}</div>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        async function loadRandomMovies(btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            document.getElementById('loading').style.display = 'block';
            document.getElementById('moviesRow').innerHTML = '';
            document.getElementById('moviePage').classList.remove('active');
            
            try {
                const randomPage = Math.floor(Math.random() * 30) + 1;
                const data = await fetchFromTMDB('/movie/popular', { page: randomPage });
                const shuffled = [...(data.results || [])];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                displayMovies(shuffled.slice(0, 20));
            } catch (error) {
                document.getElementById('moviesRow').innerHTML = `<div style="color:red;">❌ خطأ: ${error.message}</div>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        async function searchMovies() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('loading').style.display = 'block';
            document.getElementById('moviesRow').innerHTML = '';
            document.getElementById('moviePage').classList.remove('active');
            
            try {
                const data = await fetchFromTMDB('/search/movie', { query: query });
                displayMovies(data.results || []);
            } catch (error) {
                document.getElementById('moviesRow').innerHTML = `<div style="color:red;">❌ خطأ: ${error.message}</div>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayMovies(movies) {
            const moviesRow = document.getElementById('moviesRow');
            if (!movies || movies.length === 0) {
                moviesRow.innerHTML = '<div style="color:red;">❌ لا توجد نتائج</div>';
                return;
            }
            let html = '';
            movies.forEach(movie => {
                const posterPath = movie.poster_path ? `${IMG_BASE}${movie.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                const title = movie.title || 'غير معروف';
                const originalTitle = movie.original_title || title;
                const year = movie.release_date ? movie.release_date.split('-')[0] : '';
                html += `
                    <div class="movie-card" onclick="selectMovie(${movie.id})">
                        <img class="movie-poster" src="${posterPath}" alt="${escapeHtml(title)}">
                        <div class="movie-info">
                            <div class="movie-title">${escapeHtml(title)}</div>
                            <div class="movie-title-en">${escapeHtml(originalTitle)}</div>
                            <div class="movie-year">${year}</div>
                        </div>
                    </div>
                `;
            });
            moviesRow.innerHTML = html;
        }
        
        async function selectMovie(movieId) {
            document.getElementById('loading').style.display = 'block';
            try {
                const movieData = await fetchFromTMDB(`/movie/${movieId}`);
                const creditsData = await fetchFromTMDB(`/movie/${movieId}/credits`);
                await fetchMovieLinks(movieData.title, movieData.original_title);
                displayMoviePage(movieData, creditsData.cast || []);
                document.getElementById('moviePage').classList.add('active');
                document.getElementById('moviePage').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                alert(`خطأ: ${error.message}`);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        async function fetchMovieLinks(title, originalTitle) {
            currentVideos = [];
            try {
                let searchTitle = originalTitle || title;
                const response = await fetch(API_URL + encodeURIComponent(searchTitle));
                const data = await response.json();
                currentVideos = data.videos || [];
                
                if (currentVideos.length === 0) {
                    currentVideos = [{ server: "⚠️ لا توجد روابط متاحة", link: "#" }];
                }
            } catch (error) {
                console.log("Error:", error);
                currentVideos = [{ server: "⚠️ خطأ في جلب الروابط", link: "#" }];
            }
        }
        
        function displayMoviePage(movie, cast) {
            const posterPath = movie.poster_path ? `${IMG_BASE}${movie.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Poster';
            let serversHtml = '';
            currentVideos.forEach((video, idx) => {
                serversHtml += `<button class="server-btn" onclick="playVideo(${idx})">🎥 ${escapeHtml(video.server)}</button>`;
            });
            document.getElementById('serversList').innerHTML = serversHtml;
            
            let castHtml = '';
            if (cast && cast.length > 0) {
                castHtml = `
                    <div class="cast-section">
                        <div class="cast-title">🎭 أبطال الفيلم</div>
                        <div class="cast-list">
                            ${cast.slice(0, 10).map(actor => `
                                <div class="cast-item">
                                    <img class="cast-img" src="${actor.profile_path ? `${IMG_BASE}${actor.profile_path}` : 'https://via.placeholder.com/80x80?text=No+Img'}" alt="${escapeHtml(actor.name)}">
                                    <div class="cast-name">${escapeHtml(actor.name)}</div>
                                    <div class="cast-character">${actor.character ? escapeHtml(actor.character.split('/')[0]) : ''}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('movieHero').innerHTML = `
                <div class="poster-container">
                    <img src="${posterPath}" alt="${escapeHtml(movie.title)}">
                </div>
                <div class="movie-hero-details">
                    <div class="movie-hero-title">${escapeHtml(movie.title)}</div>
                    <div class="movie-hero-title-en">${escapeHtml(movie.original_title || movie.title)}</div>
                    <div class="movie-hero-info">
                        <span class="info-badge">📅 ${movie.release_date ? movie.release_date.split('-')[0] : 'غير معروف'}</span>
                        <span class="info-badge">⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : '0'}/10</span>
                        <span class="info-badge">⏱️ ${movie.runtime ? movie.runtime + ' دقيقة' : 'غير معروف'}</span>
                    </div>
                    <div class="movie-overview">
                        <strong>📖 القصة:</strong><br>
                        ${movie.overview ? escapeHtml(movie.overview) : 'لا توجد قصة متاحة لهذا الفيلم'}
                    </div>
                    <button class="watch-btn" onclick="openWatch()">🎬 مشاهدة الفيلم الآن</button>
                    ${castHtml}
                </div>
            `;
        }
        
        function openWatch() {
            const watchFrame = document.getElementById('watchFrame');
            watchFrame.classList.add('active');
            if (currentVideos.length > 0 && currentVideos[0].link && currentVideos[0].link !== '#') {
                playVideo(0);
            }
            watchFrame.scrollIntoView({ behavior: 'smooth' });
        }
        
        function closeWatch() {
            const watchFrame = document.getElementById('watchFrame');
            const videoWrapper = document.getElementById('videoWrapper');
            watchFrame.classList.remove('active');
            videoWrapper.innerHTML = '<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>';
        }
        
        function playVideo(index) {
            const video = currentVideos[index];
            if (!video || !video.link || video.link === '#') {
                alert('لا يمكن تشغيل هذا الرابط حالياً');
                return;
            }
            const videoWrapper = document.getElementById('videoWrapper');
            let embedUrl = video.link;
            
            if (embedUrl.includes('vidspeeds.com') || embedUrl.includes('vidoba.org') || embedUrl.includes('anafast.org')) {
                if (!embedUrl.includes('embed')) {
                    embedUrl = embedUrl.replace(/\/[^\/]+\.html$/, '/embed.html');
                }
                videoWrapper.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe><button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>`;
            } else {
                videoWrapper.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe><button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>`;
            }
            
            document.querySelectorAll('.server-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }
        
        function toggleFullscreen() {
            const iframe = document.querySelector('#videoWrapper iframe');
            if (iframe) {
                if (iframe.requestFullscreen) iframe.requestFullscreen();
                else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
            }
        }
        
        function backToMovies() {
            document.getElementById('moviePage').classList.remove('active');
            document.getElementById('watchFrame').classList.remove('active');
            document.getElementById('videoWrapper').innerHTML = '<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>';
            document.getElementById('moviesSlider').scrollIntoView({ behavior: 'smooth' });
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        window.onload = () => {
            loadMoviesByCategory('popular', document.querySelector('.cat-btn'));
        };
    </script>
</body>
</html>
